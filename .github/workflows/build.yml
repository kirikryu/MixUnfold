name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 顶层最小权限；仅发布 job 在 job 级别提升为 contents: write
permissions:
  contents: read

jobs:
  # 防回归：push 与 PR 均做全历史密钥扫描，命中即失败
  secret-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        run: |
          GL_VERSION=8.30.1
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" \
            -o "$RUNNER_TEMP/gitleaks.tgz"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan full history for secrets
        run: gitleaks detect --log-opts="--all" --redact --verbose

  # 分支 / PR / 手动触发：标准 debug 签名构建（不得冒充官方发布版）
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "build-tools;34.0.0" "platforms;android-35" >/dev/null

      - name: Build APK (debug signing)
        run: |
          export JDK_BIN="$JAVA_HOME/bin"
          export BT="$ANDROID_HOME/build-tools/34.0.0"
          export AJ="$ANDROID_HOME/platforms/android-35/android.jar"
          ./build.sh

  # 仅 tag 触发：production 环境签名 + 发布（Environment 在仓库 Settings 配置）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [secret-scan]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "build-tools;34.0.0" "platforms;android-35" >/dev/null

      # tag 构建必须产出官方签名的发布版：缺 Secrets 直接失败，
      # 绝不允许回退 debug 签名冒充官方发布。
      - name: Decode release keystore from Secrets
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
        run: |
          if [ -z "$RELEASE_KEYSTORE" ] || [ -z "$RELEASE_KEYSTORE_PASS" ]; then
            echo "::error::tag 构建需要 production 环境的 Secrets：RELEASE_KEYSTORE_BASE64 与 RELEASE_KEYSTORE_PASS（缺一则无法产出官方签名发布版）"
            exit 1
          fi
          SIGN_DIR="$RUNNER_TEMP/signing"
          mkdir -p "$SIGN_DIR"
          printf '%s' "$RELEASE_KEYSTORE" | base64 -d > "$SIGN_DIR/release.jks"
          # 只把 keystore 路径写入 GITHUB_ENV；密码经 Build 步骤的 env
          # 直接从 Secrets 注入进程，不落盘、不进日志。
          echo "RELEASE_STORE_FILE=$SIGN_DIR/release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=mixunfold" >> "$GITHUB_ENV"

      - name: Build APK (release signing)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASS }}
        run: |
          export JDK_BIN="$JAVA_HOME/bin"
          export BT="$ANDROID_HOME/build-tools/34.0.0"
          export AJ="$ANDROID_HOME/platforms/android-35/android.jar"
          ./build.sh --release

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      - name: Verify signature and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK=releases/MixUnfold.apk
          "$BT/apksigner" verify --print-certs "$APK"
          # 校验值只写入附件 SHA256SUMS.txt，不进 Release 正文
          APK_SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          CERT_SHA="$("$BT/apksigner" verify --print-certs "$APK" \
              | grep 'SHA-256 digest' | head -1 | awk '{print $NF}')"
          printf '%s  %s\n# certificate SHA-256 (apksigner): %s\n' \
              "$APK_SHA" "$(basename "$APK")" "$CERT_SHA" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "MixUnfold ${GITHUB_REF_NAME#v}" \
              --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
          # 正文只留一行校验指针；重跑时已有则不重复追加
          BODY="$(gh release view "$GITHUB_REF_NAME" --json body -q .body)"
          case "$BODY" in
            *SHA256SUMS.txt*) ;;
            *) printf '%s\n\n完整性校验：见附件 `SHA256SUMS.txt`；校验方法见 README「签名与校验」。\n' \
                "$BODY" | gh release edit "$GITHUB_REF_NAME" --notes-file - ;;
          esac
