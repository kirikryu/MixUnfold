name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "build-tools;34.0.0" "platforms;android-35" >/dev/null

      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            mkdir -p keystore
            echo "$RELEASE_KEYSTORE" | base64 -d > keystore/release.jks
          fi

      - name: Build APK
        env:
          RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
        run: |
          export JDK_BIN="$JAVA_HOME/bin"
          export BT="$ANDROID_HOME/build-tools/34.0.0"
          export AJ="$ANDROID_HOME/platforms/android-35/android.jar"
          if [ -f keystore/release.jks ] && [ -n "$RELEASE_KEYSTORE_PASS" ]; then
            export KS=keystore/release.jks KS_ALIAS=mixunfold KS_PASS="$RELEASE_KEYSTORE_PASS"
          fi
          ./build.sh

      - name: Create release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" releases/MixUnfold.apk \
              --title "MixUnfold ${GITHUB_REF_NAME#v}" \
              --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" releases/MixUnfold.apk --clobber
